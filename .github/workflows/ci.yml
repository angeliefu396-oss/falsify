name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Windows runners default to cp1252 for stdout, which breaks any Chinese output
  # (build.py prints Chinese; unittest prints Chinese assertion messages).
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  PYTHONLEGACYWINDOWSSTDIO: "0"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 生成物与真源同步检查
        run: python scripts/build.py --check
      - name: 单元与端到端测试
        run: python -m unittest discover -s tests -v
